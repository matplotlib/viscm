name: "Release"
permissions:
  contents: "read"
on:
  release:
    types:
      - "published"

jobs:

  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Python"
        uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"  # v7.1.0
        with:
          python-version: "3.12"

      - name: "Install build tool"
        run: "pip install --user build"

      - name: "Build binary dist (wheel) and source dist"
        run: "python -m build"

      - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "dist"
          path: "dist/"

  pypi-publish:
    name: "Upload dist to PyPI"
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/viscm"
    permissions:
      id-token: "write"
    steps:
      - name: "Get build artifact"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: "dist"
          path: "dist/"

      - name: "Upload dist to PyPI"
        uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086" # v1.14.3
